<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" font-family="system-ui, sans-serif">
  <!-- MCP hub-and-spoke illustration. The centre node is the MCP
       server; surrounding nodes are tools. The lines are
       deliberately dashed to look like JSON-RPC requests travelling
       back and forth. Everything is inline so the file ships as
       a static asset (no font dependency). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>
  <circle cx="400" cy="240" r="220" fill="url(#halo)"/>
  <!-- Decorative dots in the corners -->
  <circle cx="40"  cy="60"  r="6" fill="rgba(255,255,255,0.25)"/>
  <circle cx="760" cy="420" r="6" fill="rgba(255,255,255,0.25)"/>
  <circle cx="720" cy="80"  r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="80"  cy="400" r="4" fill="rgba(255,255,255,0.2)"/>

  <!-- Connection lines. Drawn first so the nodes land on top.
       Six radial spokes from the centre to the tool nodes. -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round">
    <line x1="400" y1="240" x2="170" y2="120"/>
    <line x1="400" y1="240" x2="630" y2="120"/>
    <line x1="400" y1="240" x2="120" y2="280"/>
    <line x1="400" y1="240" x2="680" y2="280"/>
    <line x1="400" y1="240" x2="200" y2="410"/>
    <line x1="400" y1="240" x2="600" y2="410"/>
  </g>

  <!-- Central MCP server node. Slightly larger than the tool
       nodes to make the hub obvious. -->
  <g transform="translate(400 240)">
    <circle r="74" fill="url(#server)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <circle r="74" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6" stroke-dasharray="2 6"/>
    <!-- Server-stacked-lines icon -->
    <g transform="translate(-26 -22)" stroke="#16a34a" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0"  x2="52" y2="0"/>
      <line x1="0" y1="12" x2="38" y2="12"/>
      <line x1="0" y1="24" x2="52" y2="24"/>
      <line x1="0" y1="36" x2="30" y2="36"/>
    </g>
    <text y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">MCP</text>
    <text y="84" text-anchor="middle" font-size="11" fill="#475569">server</text>
  </g>

  <!-- Tool nodes. Each is a rounded rectangle with a tool icon.
       Tool icons are simple geometric shapes — keeps the SVG
       monochrome and language-neutral. -->
  <!-- Top-left tool: a function/method bracket icon -->
  <g transform="translate(170 120)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-18 -14)" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 8 0 C 0 0 0 6 0 14 C 0 22 0 28 8 28"/>
      <path d="M 28 0 C 36 0 36 6 36 14 C 36 22 36 28 28 28"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>
  <!-- Top-right tool: a database cylinder -->
  <g transform="translate(630 120)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-14 -16)" stroke="#0f766e" stroke-width="3" fill="none">
      <ellipse cx="14" cy="4" rx="14" ry="4"/>
      <path d="M 0 4 V 28 A 14 4 0 0 0 28 28 V 4"/>
      <path d="M 0 16 A 14 4 0 0 0 28 16" stroke-dasharray="3 3"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>
  <!-- Mid-left tool: a document / file -->
  <g transform="translate(120 280)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-12 -16)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 0 0 H 18 L 24 6 V 32 H 0 Z"/>
      <path d="M 18 0 V 6 H 24"/>
      <line x1="5" y1="14" x2="19" y2="14"/>
      <line x1="5" y1="20" x2="19" y2="20"/>
      <line x1="5" y1="26" x2="14" y2="26"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>
  <!-- Mid-right tool: gear -->
  <g transform="translate(680 280)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-16 -16)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 16 0 L 19 4 L 24 3 L 26 8 L 32 9 L 31 14 L 34 18 L 30 22 L 31 27 L 26 28 L 24 32 L 19 31 L 16 34 L 13 31 L 8 32 L 6 27 L 1 26 L 2 22 L -2 18 L 1 14 L 0 9 L 6 8 L 8 3 L 13 4 Z"/>
      <circle cx="16" cy="17" r="5"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>
  <!-- Bottom-left tool: a graph/chart -->
  <g transform="translate(200 410)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-16 -14)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <line x1="0" y1="28" x2="32" y2="28"/>
      <line x1="0" y1="28" x2="0"  y2="0"/>
      <polyline points="4,24 12,12 18,18 28,4"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>
  <!-- Bottom-right tool: a clock/timer -->
  <g transform="translate(600 410)">
    <circle r="42" fill="url(#tool)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <g transform="translate(-14 -14)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="14" cy="14" r="14"/>
      <polyline points="14,6 14,14 22,18"/>
    </g>
    <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">tool</text>
  </g>

  <!-- Tiny "JSON-RPC" travel pulses on a couple of spokes. Drawn
       as small white dots positioned along the lines so the eye
       reads "messages moving between server and tools". -->
  <g fill="#ffffff">
    <circle cx="285" cy="180" r="3"/>
    <circle cx="515" cy="300" r="3"/>
    <circle cx="300" cy="325" r="3"/>
    <circle cx="500" cy="160" r="3"/>
  </g>
</svg>
